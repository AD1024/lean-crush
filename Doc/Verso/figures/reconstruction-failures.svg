<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 744" role="img" aria-labelledby="title description">
<title id="title">Proof reconstruction failure modes</title>
<desc id="description">One pie per corpus showing strict-lane failure records by reported cause.</desc>
<style>
text { fill: #1B2927; font-family: 'Avenir Next', 'IBM Plex Sans', sans-serif; }
.title { font-size: 25px; font-weight: 700; letter-spacing: .2px; }
.subtitle { fill: #64716E; font-size: 13px; }
.axis { fill: #64716E; font-size: 12px; }
.label { font-size: 13px; font-weight: 600; }
.value { font-size: 11px; font-weight: 600; }
.on-dark { fill: #FFFFFF; }
.legend { font-size: 12px; }
.grid { stroke: #D9D5CB; stroke-width: 1; }
.axis-line { stroke: #64716E; stroke-width: 1.2; }
</style>
